
name: Construir y guardar compilador MXE

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential autoconf automake autopoint \
            bison flex gperf intltool libtool libtool-bin \
            nasm yasm pkg-config patch wget curl git \
            python3 python3-mako python3-pip \
            unzip p7zip-full xz-utils texinfo gettext \
            libssl-dev libgdk-pixbuf2.0-dev lzip

      - name: Descargar MXE
        run: |
          git clone https://github.com/mxe/mxe.git mxe-source
          git -C mxe-source checkout bdc0e9e2cf878d64086a6f3b51bc443d4c5ebb9c
          echo 'MXE_TARGETS := x86_64-w64-mingw32.shared' > mxe-source/settings.mk

      - name: Recuperar compilador si existe
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            mxe-source/usr
            mxe-source/pkg
          key: mxe-64bits-bdc0e9e2-ubuntu2204-v1

      - name: Construir compilador y zlib
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          make -C mxe-source -j2 zlib \
            MXE_TARGETS=x86_64-w64-mingw32.shared

      - name: Comprobar archivos generados
        run: |
          test -f mxe-source/usr/x86_64-w64-mingw32.shared/installed/zlib
          test -f mxe-source/usr/x86_64-w64-mingw32.shared/bin/zlib1.dll
          echo "Compilacion y comprobacion correctas"
          du -sh mxe-source/usr mxe-source/pkg
          df -h .

      - name: Guardar compilador en cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            mxe-source/usr
            mxe-source/pkg
          key: mxe-64bits-bdc0e9e2-ubuntu2204-v1

  verificar-cache:
    needs: construir
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Recuperar compilador guardado
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            mxe-source/usr
            mxe-source/pkg
          key: mxe-64bits-bdc0e9e2-ubuntu2204-v1
          fail-on-cache-miss: true

      - name: Comprobar recuperacion
        run: |
          test -f mxe-source/usr/x86_64-w64-mingw32.shared/installed/zlib
          test -f mxe-source/usr/x86_64-w64-mingw32.shared/bin/zlib1.dll
          echo "CACHE RECUPERADA CORRECTAMENTE"
          du -sh mxe-source/usr mxe-source/pkg
