
name: Compilar bibliotecas de video MXE

on:
  workflow_dispatch:

jobs:
  video:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential autoconf automake autopoint \
            bison flex gperf intltool libtool libtool-bin \
            nasm yasm pkg-config patch wget curl git \
            python3 python3-mako python3-pip \
            unzip p7zip-full xz-utils texinfo gettext \
            libssl-dev libgdk-pixbuf2.0-dev lzip

      - name: Descargar MXE
        run: |
          git clone https://github.com/mxe/mxe.git mxe-source
          git -C mxe-source checkout \
            bdc0e9e2cf878d64086a6f3b51bc443d4c5ebb9c
          echo 'MXE_TARGETS := x86_64-w64-mingw32.shared' \
            > mxe-source/settings.mk

      - name: Recuperar cache de audio
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            mxe-source/usr
            mxe-source/pkg
          key: mxe-64bits-bdc0e9e2-audio-v1
          fail-on-cache-miss: true

      - name: Comprobar cache recuperada
        run: |
          test "${{ steps.cache.outputs.cache-hit }}" = "true"
          test -f \
            mxe-source/usr/x86_64-w64-mingw32.shared/installed/qtbase
          for p in ogg vorbis opus lame; do
            test -f \
              "mxe-source/usr/x86_64-w64-mingw32.shared/installed/$p"
          done
          echo "Qt y audio recuperados correctamente"

      - name: Compilar x264 y x265
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          make -C mxe-source -j2 x264 x265 \
            MXE_TARGETS=x86_64-w64-mingw32.shared \
            2>&1 | tee compilacion-video.log

      - name: Generar informe
        if: always()
        shell: bash
        run: |
          {
            echo "=== RESULTADO ==="
            echo "${{ steps.build.outcome }}"
            echo "=== BIBLIOTECAS ==="
            for p in x264 x265; do
              if test -f \
                "mxe-source/usr/x86_64-w64-mingw32.shared/installed/$p"; then
                echo "$p: OK"
              else
                echo "$p: PENDIENTE"
              fi
            done
            echo "=== TAMANO ==="
            du -sh mxe-source/usr mxe-source/pkg \
              2>/dev/null || true
            echo "=== ESPACIO LIBRE ==="
            df -h .
            echo "=== ULTIMAS 100 LINEAS ==="
            tail -100 compilacion-video.log \
              2>/dev/null || true
          } > informe-video.txt

      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-compilacion-video
          path: |
            informe-video.txt
            compilacion-video.log
          if-no-files-found: warn
          retention-days: 30

      - name: Guardar cache ampliada de video
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            mxe-source/usr
            mxe-source/pkg
          key: mxe-64bits-bdc0e9e2-video-v1

      - name: Comprobar resultado
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = "success"
