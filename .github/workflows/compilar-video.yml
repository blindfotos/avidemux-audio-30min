
name: Compilar x265 con MXE

on:
  workflow_dispatch:

jobs:
  compilar-x265:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential autoconf automake autopoint \
            bison flex gperf intltool libtool libtool-bin \
            nasm yasm pkg-config patch wget curl git \
            python3 python3-mako python3-pip \
            unzip p7zip-full xz-utils texinfo gettext \
            libssl-dev libgdk-pixbuf2.0-dev lzip cmake

      - name: Descargar MXE
        run: |
          git clone https://github.com/mxe/mxe.git mxe-source
          git -C mxe-source checkout \
            bdc0e9e2cf878d64086a6f3b51bc443d4c5ebb9c
          echo 'MXE_TARGETS := x86_64-w64-mingw32.shared' \
            > mxe-source/settings.mk

      - name: Recuperar cache x264
        uses: actions/cache/restore@v4
        with:
          path: |
            mxe-source/usr
            mxe-source/pkg
          key: mxe-64bits-bdc0e9e2-x264-v1
          fail-on-cache-miss: true

      - name: Corregir fechas de MXE
        shell: bash
        run: |
          git -C mxe-source ls-files -z |
            while IFS= read -r -d '' archivo; do
              touch -d '2000-01-01 00:00:00 UTC' \
                "mxe-source/$archivo"
            done

      - name: Descargar x265 desde VideoLAN
        shell: bash
        run: |
          mkdir -p mxe-source/pkg
          curl --fail --location --retry 3 \
            --output mxe-source/pkg/x265_4.2.tar.gz \
            https://download.videolan.org/pub/videolan/x265/x265_4.2.tar.gz

          test -s mxe-source/pkg/x265_4.2.tar.gz
          tar -tzf mxe-source/pkg/x265_4.2.tar.gz \
            > /dev/null

          echo "Archivo descargado correctamente"
          sha256sum mxe-source/pkg/x265_4.2.tar.gz



      - name: Reparar rutas de compiladores
        shell: bash
        run: |
          set -e

          BASE="$PWD/mxe-source/usr"
          DESTINO="$BASE/x86_64-pc-linux-gnu/bin"

          mkdir -p "$DESTINO"

          for herramienta in gcc g++; do
            ORIGEN="$BASE/bin/x86_64-w64-mingw32.shared-$herramienta"
            ENLACE="$DESTINO/x86_64-w64-mingw32.shared-$herramienta"

            test -x "$ORIGEN"
            ln -sfn "$ORIGEN" "$ENLACE"

            echo "Comprobando $herramienta:"
            "$ENLACE" --version | head -1
          done

      - name: Compilar x265
        shell: bash
        run: |
          export PATH="$PWD/mxe-source/usr/bin:$PATH"

          make -C mxe-source -j2 x265 \
            MXE_TARGETS=x86_64-w64-mingw32.shared



      - name: Comprobar resultado
        shell: bash
        run: |
          echo "Marcadores de x265:"
          find mxe-source/usr \
            -path '*/installed/*' \
            -iname '*x265*' -print

          echo "Bibliotecas x265:"
          find mxe-source/usr \
            \( -iname '*x265*.dll' -o \
               -iname '*x265*.a' \) -print

      - name: Guardar cache con x265
        uses: actions/cache/save@v4
        with:
          path: |
            mxe-source/usr
            mxe-source/pkg
          key: mxe-64bits-bdc0e9e2-x265-v1

      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-compilacion-x265
          path: |
            mxe-source/log
            mxe-source/src/x265.mk
          if-no-files-found: ignore
