name: Audit Avidemux 2.8.1 audio shift limits
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Download upstream Avidemux 2.8.1
        uses: actions/checkout@v4
        with:
          repository: mean00/avidemux2
          ref: '2.8.1'
          path: avidemux
      - name: Identify time-shift constraints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('avidemux')
          needles=[re.compile(x,re.I) for x in (r'99999',r'99\s*999',r'shiftInMs',r'timeShift',r'setRange\s*\(',r'setMaximum\s*\(')]
          with open('audit-report.txt','w',encoding='utf-8') as out:
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in ('.cpp','.h','.ui','.py','.js','.json','.xml'): continue
                  try: lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
                  except OSError: continue
                  for i,line in enumerate(lines):
                      if any(n.search(line) for n in needles):
                          if ('shift' in line.lower() or '99999' in line or 'setRange' in line or 'setMaximum' in line):
                              out.write(f'{p}:{i+1}: {line.strip()}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audio-shift-audit
          path: audit-report.txt
