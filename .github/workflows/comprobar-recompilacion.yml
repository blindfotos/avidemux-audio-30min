
name: Comprobar por que GCC se recompila

on:
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Descargar MXE
        run: |
          git clone https://github.com/mxe/mxe.git mxe-source
          git -C mxe-source checkout \
            bdc0e9e2cf878d64086a6f3b51bc443d4c5ebb9c
          echo 'MXE_TARGETS := x86_64-w64-mingw32.shared' \
            > mxe-source/settings.mk

      - name: Recuperar cache x264
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            mxe-source/usr
            mxe-source/pkg
          key: mxe-64bits-bdc0e9e2-x264-v1
          fail-on-cache-miss: true

      - name: Comprobar fechas y marcadores
        shell: bash
        run: |
          {
            echo "=== CACHE RECUPERADA ==="
            echo "${{ steps.cache.outputs.cache-hit }}"
            echo "=== FECHAS ==="
            for f in \
              mxe-source/src/gcc.mk \
              mxe-source/src/binutils.mk \
              mxe-source/usr/x86_64-w64-mingw32.shared/installed/gcc \
              mxe-source/usr/x86_64-w64-mingw32.shared/installed/binutils \
              mxe-source/usr/x86_64-w64-mingw32.shared/installed/x264; do
              stat -c '%y %n' "$f" || true
            done
            echo "=== VERSION DE MAKE ==="
            make --version | head -1
          } > informe-fechas.txt

      - name: Simular construccion de GCC
        shell: bash
        run: |
          timeout 180 make -C mxe-source -n -j1 gcc \
            MXE_TARGETS=x86_64-w64-mingw32.shared \
            > simulacion-gcc.txt 2>&1 || \
            echo "La simulacion GCC devolvio un aviso" \
              >> simulacion-gcc.txt

      - name: Simular construccion de x264
        shell: bash
        run: |
          timeout 180 make -C mxe-source -n -j1 x264 \
            MXE_TARGETS=x86_64-w64-mingw32.shared \
            > simulacion-x264.txt 2>&1 || \
            echo "La simulacion x264 devolvio un aviso" \
              >> simulacion-x264.txt

      - name: Resumir resultados
        if: always()
        shell: bash
        run: |
          {
            cat informe-fechas.txt 2>/dev/null || true
            echo "=== SIMULACION GCC ==="
            head -60 simulacion-gcc.txt 2>/dev/null || true
            echo "=== SIMULACION X264 ==="
            head -60 simulacion-x264.txt 2>/dev/null || true
            echo "=== TAMANOS DE LOS REGISTROS ==="
            wc -l simulacion-*.txt 2>/dev/null || true
          } > resumen.txt

      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-recompilacion
          path: |
            resumen.txt
            informe-fechas.txt
            simulacion-gcc.txt
            simulacion-x264.txt
          if-no-files-found: warn
