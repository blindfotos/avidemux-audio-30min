
name: Compilar nucleo Avidemux 2.8.1

on:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Descargar nuestro proyecto
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake git python3 pkg-config \
            autoconf automake autopoint bison flex gperf \
            intltool libtool libtool-bin nasm yasm \
            patch wget curl unzip p7zip-full xz-utils \
            texinfo gettext libssl-dev \
            libgdk-pixbuf2.0-dev lzip

      - name: Descargar MXE
        run: |
          git clone https://github.com/mxe/mxe.git mxe-source
          git -C mxe-source checkout \
            bdc0e9e2cf878d64086a6f3b51bc443d4c5ebb9c

          echo 'MXE_TARGETS := x86_64-w64-mingw32.shared' \
            > mxe-source/settings.mk

      - name: Recuperar cache x265
        uses: actions/cache/restore@v4
        with:
          path: |
            mxe-source/usr
            mxe-source/pkg
          key: mxe-64bits-bdc0e9e2-x265-v1
          fail-on-cache-miss: true

      - name: Corregir fechas de MXE
        shell: bash
        run: |
          git -C mxe-source ls-files -z |
            while IFS= read -r -d '' archivo; do
              touch -d '2000-01-01 00:00:00 UTC' \
                "mxe-source/$archivo"
            done

      - name: Reparar rutas de compiladores
        shell: bash
        run: |
          set -e

          BASE="$PWD/mxe-source/usr"
          DESTINO="$BASE/x86_64-pc-linux-gnu/bin"

          mkdir -p "$DESTINO"

          for herramienta in gcc g++; do
            ORIGEN="$BASE/bin/x86_64-w64-mingw32.shared-$herramienta"
            ENLACE="$DESTINO/x86_64-w64-mingw32.shared-$herramienta"

            test -x "$ORIGEN"
            ln -sfn "$ORIGEN" "$ENLACE"
            "$ENLACE" --version | head -1
          done

          echo "$BASE/bin" >> "$GITHUB_PATH"


      - name: Descargar Avidemux 2.8.1
        shell: bash
        run: |
          set -e

          git clone https://github.com/mean00/avidemux2.git avidemux
          git -C avidemux checkout 2.8.1

          echo "=== SUBMODULOS ==="
          git -C avidemux submodule status || true

          echo "=== DESCARGANDO SUBMODULOS ==="
          git -C avidemux submodule update --init --recursive

          echo "=== COMPROBANDO TRADUCCIONES ==="
          ls -la avidemux/avidemux/qt4/i18n/ || true

          if [ ! -f avidemux/avidemux/qt4/i18n/CMakeLists.txt ]; then
            echo "ERROR: sigue faltando i18n/CMakeLists.txt"
            echo "Es necesario revisar como se distribuyen"
            echo "las traducciones en Avidemux 2.8.1"
            exit 1
          fi

          echo "Archivos de traduccion encontrados"

      - name: Aplicar parche de 30 minutos
        run: |
          python3 patch_shift.py

          grep -q -- '<number>-1800000</number>' \
            avidemux/avidemux/qt4/ADM_userInterfaces/ADM_gui/gui2.ui

          grep -q -- '<number>1800000</number>' \
            avidemux/avidemux/qt4/ADM_userInterfaces/ADM_gui/gui2.ui

          grep -q -- 'timeShift, -1800000, 1800000' \
            avidemux/avidemux_plugins/ADM_scriptEngines/qtScript/src/AudioOutput.cpp

          echo "Parche verificado"

      - name: Corregir ensamblador FFmpeg para GCC 15
        shell: bash
        run: |
          python3 - <<'PY'
          import tarfile
          import tempfile
          import os
          import io
          from pathlib import Path

          archivo = Path(
              "avidemux/avidemux_core/ffmpeg_package/"
              "ffmpeg-4.4.2.tar.bz2"
          )

          temporal = archivo.with_suffix(".tmp")

          cambios = 0

          with tarfile.open(archivo, "r:bz2") as origen:
              with tarfile.open(temporal, "w:bz2") as destino:
                  for miembro in origen:
                      if not miembro.isfile():
                          destino.addfile(miembro)
                          continue

                      contenido = origen.extractfile(miembro).read()

                      if miembro.name.endswith(
                          "/libavcodec/x86/mathops.h"
                      ):
                          anterior = (
                              b'"ic" ((uint8_t)(-s))'
                          )
                          nuevo = (
                              b'"c" ((uint8_t)(-s))'
                          )

                          cantidad = contenido.count(anterior)

                          if cantidad != 2:
                              raise RuntimeError(
                                  "Se esperaban 2 cambios, "
                                  f"encontrados {cantidad}"
                              )

                          contenido = contenido.replace(
                              anterior, nuevo
                          )
                          cambios += cantidad

                      miembro.size = len(contenido)
                      destino.addfile(
                          miembro, io.BytesIO(contenido)
                      )

          if cambios != 2:
              raise RuntimeError(
                  "No se encontraron las dos funciones"
              )

          os.replace(temporal, archivo)

          print(
              "FFmpeg corregido correctamente: "
              "2 restricciones de ensamblador"
          )
          PY


      - name: Preparar herramientas de traduccion Qt5
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y qttools5-dev-tools

          echo "=== LOCALIZANDO LRELEASE ==="

          LRELEASE=""

          for candidato in \
            /usr/lib/qt5/bin/lrelease \
            /usr/bin/lrelease; do
            if [ -x "$candidato" ]; then
              LRELEASE="$candidato"
              break
            fi
          done

          if [ -z "$LRELEASE" ]; then
            echo "ERROR: no se encuentra lrelease"
            exit 1
          fi

          echo "Encontrado: $LRELEASE"
          "$LRELEASE" -version

          echo "=== CONFIGURANDO AVIDEMUX ==="

          ARCHIVO="avidemux/avidemux/qt4/i18n/Ts.cmake"

          test -f "$ARCHIVO"

          export LRELEASE
          python3 - <<'PY'
          import os
          from pathlib import Path

          archivo = Path(
              "avidemux/avidemux/qt4/i18n/Ts.cmake"
          )

          contenido = archivo.read_text()

          configuracion = (
              'set(LRELEASE_EXECUTABLE "'
              + os.environ["LRELEASE"]
              + '" CACHE FILEPATH '
              + '"Qt5 translation compiler" FORCE)\n'
          )

          archivo.write_text(configuracion + contenido)

          print("Ruta de lrelease configurada:")
          print(os.environ["LRELEASE"])
          PY


      - name: Compilar Avidemux completo
        shell: bash
        run: |
          set -o pipefail

          cd avidemux

          bash bootStrapCrossMingwQt5_mxe.sh \
            --64 \
            --mxe-root="$GITHUB_WORKSPACE/mxe-source" \
            --with-core \
            --with-qt \
            --without-cli \
            --with-plugins \
            --nopkg \
            2>&1 | tee "$GITHUB_WORKSPACE/compilacion-completa.txt"


      - name: Recuperar error de compilacion Qt
        if: always()
        shell: bash
        run: |
          echo "=== REGISTRO DE COMPILACION QT ==="

          ARCHIVO="/tmp/logbuildMingwQt5-x86_64"

          if [ -f "$ARCHIVO" ]; then
            cp "$ARCHIVO" error-compilacion-qt.txt

            echo "=== ULTIMAS 100 LINEAS ==="
            tail -100 "$ARCHIVO"

            echo "=== ERRORES DETECTADOS ==="
            grep -nEi \
              'fatal error:|error:|undefined reference|No rule to make target' \
              "$ARCHIVO" | tail -60 || true
          else
            echo "No se encontro el registro de Qt"
          fi

      - name: Guardar diagnostico Qt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-compilacion-qt
          path: error-compilacion-qt.txt
          if-no-files-found: warn
          retention-days: 30


      - name: Preparar paquete Avidemux
        if: success()
        shell: bash
        run: |
          set -e

          ORIGEN="$GITHUB_WORKSPACE/mxe-source/usr/x86_64-w64-mingw32.shared/out/avidemux"

          echo "=== COMPROBANDO INSTALACION ==="

          test -d "$ORIGEN"

          find "$ORIGEN" -maxdepth 4 -type f \
            > archivos-instalados.txt

          echo "=== EJECUTABLES ==="
          find "$ORIGEN" -type f -iname '*.exe'

          echo "=== BIBLIOTECAS ==="
          find "$ORIGEN" -type f -iname '*.dll' | head -40

          echo "=== CREANDO PAQUETE ==="

          mkdir -p paquete-completo

          tar -czf \
            paquete-completo/avidemux-281-windows64.tar.gz \
            -C "$ORIGEN" .

          ls -lh paquete-completo/

      - name: Guardar Avidemux completo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: avidemux-281-windows64-30min
          path: |
            paquete-completo/avidemux-281-windows64.tar.gz
            archivos-instalados.txt
          if-no-files-found: error
          retention-days: 30



      - name: Comprobar archivos y preparar nucleo
        if: success()
        shell: bash
        run: |
          set -e

          mkdir -p paquete-nucleo

          echo "=== BUSCANDO CARPETAS DE COMPILACION ===" \
            | tee resultado-nucleo.txt

          find avidemux -maxdepth 3 -type d \
            -name 'buildMingwCore*' \
            -print | tee -a resultado-nucleo.txt

          echo "=== BUSCANDO BIBLIOTECAS DEL NUCLEO ===" \
            | tee -a resultado-nucleo.txt

          find avidemux -type f \
            \( -name 'libADM_core*.dll' \
               -o -name 'libADM_core*.a' \
               -o -name 'ADM_core*.dll' \) \
            -print | tee -a resultado-nucleo.txt

          echo "=== LOCALIZANDO INSTALACION ===" \
            | tee -a resultado-nucleo.txt


          find avidemux -type f \
            -name '*ADM_core*' \
            -print > listado-archivos-nucleo.txt

          head -80 listado-archivos-nucleo.txt \
            | tee -a resultado-nucleo.txt

          echo "=== GUARDANDO DIRECTORIOS DEL NUCLEO ==="

          find avidemux -maxdepth 3 -type d \
            -name 'buildMingwCore*' -print0 \
            > directorios-nucleo.txt

          if [ ! -s directorios-nucleo.txt ]; then
            echo "ERROR: no se encontro el directorio del nucleo"
            exit 1
          fi

          tar -czf paquete-nucleo/nucleo-build.tar.gz \
            --null -T directorios-nucleo.txt

          echo "=== TAMANO DEL PAQUETE ==="
          ls -lh paquete-nucleo/

          echo "Preparacion completada"

      - name: Guardar nucleo compilado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: avidemux-281-nucleo-compilado
          path: paquete-nucleo/nucleo-build.tar.gz
          if-no-files-found: error
          retention-days: 30


      - name: Recuperar error de compilacion
        if: always()
        shell: bash
        run: |
          echo "Buscando registros de compilacion..."

          find /tmp -maxdepth 1 \
            -name 'logbuildMingw*' -print

          if [ -f /tmp/logbuildMingwCore-x86_64 ]; then
            cp /tmp/logbuildMingwCore-x86_64 \
              error-compilacion-nucleo.txt

            echo "=== ULTIMAS 100 LINEAS ==="
            tail -100 error-compilacion-nucleo.txt
          else
            echo "No se encontro el registro de make"
          fi


      - name: Diagnosticar error de ensamblador FFmpeg
        if: always()
        shell: bash
        run: |
          set +e

          FFBUILD="$GITHUB_WORKSPACE/avidemux/buildMingwCore-x86_64/ffmpeg/build"
          GCC="$GITHUB_WORKSPACE/mxe-source/usr/bin/x86_64-w64-mingw32.shared-gcc"

          mkdir -p "$GITHUB_WORKSPACE/diagnostico-asm"

          if [ ! -f "$FFBUILD/Makefile" ]; then
            echo "No existe el Makefile de FFmpeg"
            exit 0
          fi

          cd "$FFBUILD"

          rm -f libavformat/adtsenc.o

          echo "Reproduciendo el error con ensamblador conservado..."

          make -j1 V=1 libavformat/adtsenc.o \
            CC="$GCC -save-temps=obj" \
            > "$GITHUB_WORKSPACE/diagnostico-asm/compilacion.txt" 2>&1

          echo "Codigo de salida: $?" \
            >> "$GITHUB_WORKSPACE/diagnostico-asm/compilacion.txt"

          echo "Buscando archivos ensamblador..."

          find . -type f -name 'adtsenc.s' \
            -exec cp {} "$GITHUB_WORKSPACE/diagnostico-asm/" \;

          if [ -f "$GITHUB_WORKSPACE/diagnostico-asm/adtsenc.s" ]; then
            grep -n -i -C 5 \
              -E 'shr|shrq|shrl' \
              "$GITHUB_WORKSPACE/diagnostico-asm/adtsenc.s" \
              > "$GITHUB_WORKSPACE/diagnostico-asm/instrucciones-shr.txt"
          fi

          echo "=== RESULTADO ==="
          tail -60 "$GITHUB_WORKSPACE/diagnostico-asm/compilacion.txt"

          echo "=== ARCHIVOS GENERADOS ==="
          ls -lh "$GITHUB_WORKSPACE/diagnostico-asm/"


      - name: Guardar registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-nucleo-avidemux
          path: |
            compilacion-completa.txt
            archivos-instalados.txt
            avidemux/buildMingwQt5-x86_64/CMakeCache.txt
            avidemux/buildMingwPluginsQt5-x86_64/CMakeCache.txt
            compilacion-nucleo.txt
            error-compilacion-nucleo.txt
            resultado-nucleo.txt
            avidemux/buildMingwCore-x86_64/CMakeCache.txt
            diagnostico-asm/
            avidemux/buildMingwCore-x86_64/CMakeFiles/CMakeConfigureLog.yaml
            avidemux/buildMingwCore-x86_64/CMakeFiles/CMakeOutput.log
            avidemux/buildMingwCore-x86_64/CMakeFiles/CMakeError.log
          if-no-files-found: warn
