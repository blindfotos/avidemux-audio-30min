
name: Compilar nucleo Avidemux 2.8.1

on:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Descargar nuestro proyecto
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake git python3 pkg-config \
            autoconf automake autopoint bison flex gperf \
            intltool libtool libtool-bin nasm yasm \
            patch wget curl unzip p7zip-full xz-utils \
            texinfo gettext libssl-dev \
            libgdk-pixbuf2.0-dev lzip python3-mako

      - name: Descargar MXE
        run: |
          git clone https://github.com/mxe/mxe.git mxe-source
          git -C mxe-source checkout \
            bdc0e9e2cf878d64086a6f3b51bc443d4c5ebb9c

          echo 'MXE_TARGETS := x86_64-w64-mingw32.shared' \
            > mxe-source/settings.mk

      - name: Recuperar cache x265
        uses: actions/cache/restore@v4
        with:
          path: |
            mxe-source/usr
            mxe-source/pkg
          key: mxe-64bits-bdc0e9e2-qtwinextras-v1
          fail-on-cache-miss: true

      - name: Corregir fechas de MXE
        shell: bash
        run: |
          git -C mxe-source ls-files -z |
            while IFS= read -r -d '' archivo; do
              touch -d '2000-01-01 00:00:00 UTC' \
                "mxe-source/$archivo"
            done

      - name: Reparar rutas de compiladores
        shell: bash
        run: |
          set -e

          BASE="$PWD/mxe-source/usr"
          DESTINO="$BASE/x86_64-pc-linux-gnu/bin"

          mkdir -p "$DESTINO"

          for herramienta in gcc g++; do
            ORIGEN="$BASE/bin/x86_64-w64-mingw32.shared-$herramienta"
            ENLACE="$DESTINO/x86_64-w64-mingw32.shared-$herramienta"

            test -x "$ORIGEN"
            ln -sfn "$ORIGEN" "$ENLACE"
            "$ENLACE" --version | head -1
          done

          echo "$BASE/bin" >> "$GITHUB_PATH"


      - name: Descargar Avidemux 2.8.1
        shell: bash
        run: |
          set -e

          git clone https://github.com/mean00/avidemux2.git avidemux
          git -C avidemux checkout 2.8.1

          echo "=== SUBMODULOS ==="
          git -C avidemux submodule status || true

          echo "=== DESCARGANDO SUBMODULOS ==="
          git -C avidemux submodule update --init --recursive

          echo "=== COMPROBANDO TRADUCCIONES ==="
          ls -la avidemux/avidemux/qt4/i18n/ || true

          if [ ! -f avidemux/avidemux/qt4/i18n/CMakeLists.txt ]; then
            echo "ERROR: sigue faltando i18n/CMakeLists.txt"
            echo "Es necesario revisar como se distribuyen"
            echo "las traducciones en Avidemux 2.8.1"
            exit 1
          fi

          echo "Archivos de traduccion encontrados"

      - name: Aplicar parche de 30 minutos
        run: |
          python3 patch_shift.py

          grep -q -- '<number>-1800000</number>' \
            avidemux/avidemux/qt4/ADM_userInterfaces/ADM_gui/gui2.ui

          grep -q -- '<number>1800000</number>' \
            avidemux/avidemux/qt4/ADM_userInterfaces/ADM_gui/gui2.ui

          grep -q -- 'timeShift, -1800000, 1800000' \
            avidemux/avidemux_plugins/ADM_scriptEngines/qtScript/src/AudioOutput.cpp

          echo "Parche verificado"

      - name: Corregir ensamblador FFmpeg para GCC 15
        shell: bash
        run: |
          python3 - <<'PY'
          import tarfile
          import tempfile
          import os
          import io
          from pathlib import Path

          archivo = Path(
              "avidemux/avidemux_core/ffmpeg_package/"
              "ffmpeg-4.4.2.tar.bz2"
          )

          temporal = archivo.with_suffix(".tmp")

          cambios = 0

          with tarfile.open(archivo, "r:bz2") as origen:
              with tarfile.open(temporal, "w:bz2") as destino:
                  for miembro in origen:
                      if not miembro.isfile():
                          destino.addfile(miembro)
                          continue

                      contenido = origen.extractfile(miembro).read()

                      if miembro.name.endswith(
                          "/libavcodec/x86/mathops.h"
                      ):
                          anterior = (
                              b'"ic" ((uint8_t)(-s))'
                          )
                          nuevo = (
                              b'"c" ((uint8_t)(-s))'
                          )

                          cantidad = contenido.count(anterior)

                          if cantidad != 2:
                              raise RuntimeError(
                                  "Se esperaban 2 cambios, "
                                  f"encontrados {cantidad}"
                              )

                          contenido = contenido.replace(
                              anterior, nuevo
                          )
                          cambios += cantidad

                      miembro.size = len(contenido)
                      destino.addfile(
                          miembro, io.BytesIO(contenido)
                      )

          if cambios != 2:
              raise RuntimeError(
                  "No se encontraron las dos funciones"
              )

          os.replace(temporal, archivo)

          print(
              "FFmpeg corregido correctamente: "
              "2 restricciones de ensamblador"
          )
          PY



      - name: Instalar QtWinExtras en MXE
        shell: bash
        run: |
          set -e

          cd mxe-source

          echo "=== COMPILANDO QTWINEXTRAS ==="

          test -f src/qtwinextras.mk


          make -j2 \
            MXE_TARGETS=x86_64-w64-mingw32.shared \
            qtwinextras libass

          echo "=== COMPROBANDO LIBASS ==="

          DESTINO="$PWD/usr/x86_64-w64-mingw32.shared"

          find "$DESTINO" \
            \( -name 'libass.pc' \
               -o -name 'libass.dll.a' \
               -o -name 'libass.a' \) \
            -print

          if [ ! -f "$DESTINO/lib/pkgconfig/libass.pc" ]; then
            echo "ERROR: no se encuentra libass.pc"
            exit 1
          fi

          echo "LIBASS INSTALADO"

          echo "=== VERIFICANDO BIBLIOTECA ==="

          DESTINO="$PWD/usr/x86_64-w64-mingw32.shared"

          find "$DESTINO" \
            -iname '*Qt5WinExtras*' \
            -print


           if [ -f "$DESTINO/qt5/lib/libQt5WinExtras.dll.a" ] \
              || [ -f "$DESTINO/qt5/lib/libQt5WinExtras.a" ]; then
            echo "QTWINEXTRAS INSTALADO CORRECTAMENTE"
          else
            echo "ERROR: falta la biblioteca Qt5WinExtras"
            exit 1
          fi


      - name: Guardar cache MXE con QtWinExtras
        uses: actions/cache/save@v4
        with:
          path: |
            mxe-source/usr
            mxe-source/pkg

          key: mxe-64bits-bdc0e9e2-qtwinextras-libass-v1


      - name: Diagnosticar biblioteca Qt5WinExtras
        shell: bash
        run: |
          set -e

          BASE="$GITHUB_WORKSPACE/mxe-source/usr"
          TARGET="$BASE/x86_64-w64-mingw32.shared"

          echo "=== BIBLIOTECAS WINEXTRAS ==="
          find "$BASE" \
            \( -iname '*winextras*' \
               -o -iname '*qt5win*' \) \
            -print | head -80 || true

          echo "=== CARPETA LIB DE WINDOWS ==="
          ls -l "$TARGET/lib/"*WinExtras* \
            2>/dev/null || true

          echo "=== PAQUETES MXE ==="
          find "$GITHUB_WORKSPACE/mxe-source/src" \
            -maxdepth 1 -iname '*winextras*' \
            -print

          echo "=== RUTAS DEL COMPILADOR ==="
          "$BASE/bin/x86_64-w64-mingw32.shared-g++" \
            -print-search-dirs

          echo "=== RESULTADO ==="
          if [ -f "$TARGET/qt5/lib/libQt5WinExtras.dll.a" ] \
          || [ -f "$TARGET/qt5/lib/libQt5WinExtras.a" ]; then
            echo "BIBLIOTECA ENCONTRADA"
          else
            echo "BIBLIOTECA NO ENCONTRADA"
          fi


      - name: Preparar herramientas de traduccion Qt5
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y qttools5-dev-tools

          echo "=== LOCALIZANDO LRELEASE ==="

          LRELEASE=""

          for candidato in \
            /usr/lib/qt5/bin/lrelease \
            /usr/bin/lrelease; do
            if [ -x "$candidato" ]; then
              LRELEASE="$candidato"
              break
            fi
          done

          if [ -z "$LRELEASE" ]; then
            echo "ERROR: no se encuentra lrelease"
            exit 1
          fi

          echo "Encontrado: $LRELEASE"
          "$LRELEASE" -version

          echo "=== CONFIGURANDO AVIDEMUX ==="

          ARCHIVO="avidemux/avidemux/qt4/i18n/Ts.cmake"

          test -f "$ARCHIVO"

          export LRELEASE
          python3 - <<'PY'
          import os
          from pathlib import Path

          archivo = Path(
              "avidemux/avidemux/qt4/i18n/Ts.cmake"
          )

          contenido = archivo.read_text()

          configuracion = (
              'set(LRELEASE_EXECUTABLE "'
              + os.environ["LRELEASE"]
              + '" CACHE FILEPATH '
              + '"Qt5 translation compiler" FORCE)\n'
          )

          archivo.write_text(configuracion + contenido)

          print("Ruta de lrelease configurada:")
          print(os.environ["LRELEASE"])
          PY


      - name: Corregir compatibilidad x265 y FluxSmooth
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1. Compatibilidad con x265 moderno
          archivo = Path(
              "avidemux/avidemux_plugins/"
              "ADM_videoEncoder/x265/ADM_x265Setup.cpp"
          )

          texto = archivo.read_text()

          anterior = "param.rc.statFileName=strdup(logFile);"
          nuevo = (
              "snprintf(param.rc.statFileName, "
              "sizeof(param.rc.statFileName), "
              '"%s", logFile);'
          )

          cantidad = texto.count(anterior)
          if cantidad != 2:
              raise RuntimeError(
                  f"x265: esperadas 2 apariciones, "
                  f"encontradas {cantidad}"
              )

          archivo.write_text(
              texto.replace(anterior, nuevo)
          )

          print("x265: corregidas 2 asignaciones")

          # 2. Desactivar exclusivamente FluxSmooth
          carpeta = Path(
              "avidemux/avidemux_plugins/"
              "ADM_videoFilters6"
          )

          encontrados = []

          for cmake in carpeta.rglob("CMakeLists.txt"):
              texto = cmake.read_text()
              patron = (
                  r"(?im)^[ \t]*"
                  r"add_subdirectory\s*\(\s*"
                  r"fluxSmooth\s*\)[ \t]*$"
              )

              modificado, cantidad = re.subn(
                  patron,
                  "# FluxSmooth desactivado por "
                  "incompatibilidad de ensamblador",
                  texto
              )

              if cantidad:
                  cmake.write_text(modificado)
                  encontrados.append(str(cmake))

          if len(encontrados) != 1:
              raise RuntimeError(
                  "No se pudo localizar de forma "
                  "univoca la activacion de FluxSmooth. "
                  f"Coincidencias: {encontrados}"
              )

          print("FluxSmooth desactivado en:")
          print(encontrados[0])
          print("Correcciones completadas")
          PY
  

      - name: Desactivar filtro ivtcDupeRemover
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          archivo = Path(
              "avidemux/avidemux_plugins/"
              "ADM_videoFilters6/CMakeLists.txt"
          )

          contenido = archivo.read_text()

          anterior = "ADD_SUBDIRECTORY(ivtcDupeRemover)"
          nuevo = "# ADD_SUBDIRECTORY(ivtcDupeRemover)"

          if contenido.count(anterior) != 1:
              raise RuntimeError(
                  "No se encontro exactamente una "
                  "referencia a ivtcDupeRemover"
              )

          archivo.write_text(
              contenido.replace(anterior, nuevo)
          )

          print("ivtcDupeRemover desactivado")

          if "ADD_SUBDIRECTORY(yadif)" not in contenido:
              raise RuntimeError(
                  "No se encontro el filtro Yadif"
              )

          print("Yadif permanece activado")
          PY


      - name: Compilar Avidemux completo
        shell: bash
        run: |

          set -o pipefail

          QT5_LIB="$GITHUB_WORKSPACE/mxe-source/usr/x86_64-w64-mingw32.shared/qt5/lib"

          test -f "$QT5_LIB/libQt5WinExtras.a"

          export LIBRARY_PATH="$QT5_LIB${LIBRARY_PATH:+:$LIBRARY_PATH}"

          MXE_LIB="$GITHUB_WORKSPACE/mxe-source/usr/x86_64-w64-mingw32.shared/lib"

          export PKG_CONFIG_LIBDIR="$MXE_LIB/pkgconfig"
          export PKG_CONFIG_PATH="$MXE_LIB/pkgconfig"

          echo "=== COMPROBANDO LIBASS ==="

          PKG_CONFIG="$GITHUB_WORKSPACE/mxe-source/usr/bin/x86_64-w64-mingw32.shared-pkg-config"

          if [ -x "$PKG_CONFIG" ]; then
            "$PKG_CONFIG" --modversion libass
          else
            echo "ERROR: no se encuentra pkg-config de MXE"
            exit 1
          fi

          echo "=== RUTA DE QTWINEXTRAS ==="
          echo "$LIBRARY_PATH"

          cd avidemux

          bash bootStrapCrossMingwQt5_mxe.sh \
            --64 \
            --mxe-root="$GITHUB_WORKSPACE/mxe-source" \
            --with-core \
            --with-qt \
            --without-cli \
            --with-plugins \
            --nopkg \
            2>&1 | tee "$GITHUB_WORKSPACE/compilacion-completa.txt"


      - name: Recuperar error de complementos
        if: always()
        shell: bash
        run: |
          echo "=== REGISTROS DE COMPLEMENTOS ==="

          mkdir -p diagnostico-plugins

          for archivo in /tmp/logbuildMingwPlugins*; do
            if [ -f "$archivo" ]; then
              nombre="$(basename "$archivo")"

              cp "$archivo" \
                "diagnostico-plugins/$nombre.txt"

              echo "=== ERROR EN $nombre ==="

              tail -100 "$archivo"

              echo "=== MENSAJES DE ERROR ==="

              grep -nEi \
                'fatal error:|error:|undefined reference|No rule to make target' \
                "$archivo" | tail -50 || true
            fi
          done

      - name: Guardar diagnostico de complementos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-complementos
          path: diagnostico-plugins/
          if-no-files-found: warn
          retention-days: 30


      - name: Recuperar error de compilacion Qt
        if: always()
        shell: bash
        run: |
          echo "=== REGISTRO DE COMPILACION QT ==="

          ARCHIVO="/tmp/logbuildMingwQt5-x86_64"

          if [ -f "$ARCHIVO" ]; then
            cp "$ARCHIVO" error-compilacion-qt.txt

            echo "=== ULTIMAS 100 LINEAS ==="
            tail -100 "$ARCHIVO"

            echo "=== ERRORES DETECTADOS ==="
            grep -nEi \
              'fatal error:|error:|undefined reference|No rule to make target' \
              "$ARCHIVO" | tail -60 || true
          else
            echo "No se encontro el registro de Qt"
          fi

      - name: Guardar diagnostico Qt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-compilacion-qt
          path: error-compilacion-qt.txt
          if-no-files-found: warn
          retention-days: 30


      - name: Preparar paquete Avidemux
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          BASE="$GITHUB_WORKSPACE/mxe-source/usr/x86_64-w64-mingw32.shared"
          ORIGEN="$BASE/out/avidemux"
          OBJDUMP="$GITHUB_WORKSPACE/mxe-source/usr/bin/x86_64-w64-mingw32.shared-objdump"

          echo "=== COMPROBANDO AVIDEMUX ==="
          test -f "$ORIGEN/avidemux.exe"

          if [ ! -x "$OBJDUMP" ]; then
            OBJDUMP="$(command -v x86_64-w64-mingw32.shared-objdump || true)"
          fi

          if [ -z "$OBJDUMP" ] || [ ! -x "$OBJDUMP" ]; then
            echo "ERROR: no se encuentra objdump de MXE"
            exit 1
          fi

          export BASE ORIGEN OBJDUMP

          echo "=== RESOLVIENDO DEPENDENCIAS DLL ==="

          python3 - <<'PY'
          import os
          import re
          import shutil
          import subprocess
          import sys
          from collections import deque
          from pathlib import Path

          base = Path(os.environ["BASE"])
          origen = Path(os.environ["ORIGEN"])
          objdump = os.environ["OBJDUMP"]

          rutas = [
              base / "bin",
              base / "qt5" / "bin",
          ]

          disponibles = {}

          for carpeta in rutas:
              if not carpeta.is_dir():
                  continue

              for raiz, directorios, archivos in os.walk(carpeta):
                  for nombre in archivos:
                      if nombre.lower().endswith(".dll"):
                          ruta = Path(raiz) / nombre
                          disponibles.setdefault(nombre.lower(), ruta)

          print("DLL disponibles en MXE:", len(disponibles), flush=True)

          sistema = {
              "kernel32.dll", "user32.dll", "gdi32.dll",
              "advapi32.dll", "shell32.dll", "ole32.dll",
              "oleaut32.dll", "comdlg32.dll", "comctl32.dll",
              "shlwapi.dll", "shcore.dll", "ws2_32.dll",
              "wsock32.dll", "winmm.dll", "version.dll",
              "imm32.dll", "setupapi.dll", "cfgmgr32.dll",
              "crypt32.dll", "bcrypt.dll", "bcryptprimitives.dll",
              "secur32.dll", "security.dll", "rpcrt4.dll",
              "ntdll.dll", "msvcrt.dll", "ucrtbase.dll",
              "psapi.dll", "iphlpapi.dll", "dnsapi.dll",
              "winspool.drv", "dwmapi.dll", "uxtheme.dll",
              "opengl32.dll", "glu32.dll", "gdiplus.dll",
              "msimg32.dll", "d3d9.dll", "d3d11.dll",
              "dxgi.dll", "dxguid.dll", "d2d1.dll",
              "dwrite.dll", "wtsapi32.dll", "userenv.dll",
              "netapi32.dll", "mpr.dll", "wininet.dll",
              "winhttp.dll", "normaliz.dll", "wldap32.dll",
              "ncrypt.dll", "cryptui.dll", "propsys.dll",
              "powrprof.dll", "avrt.dll", "dbghelp.dll",
              "imagehlp.dll",
              "hid.dll", "cfgmgr32.dll", "msvcp_win.dll",
              "usp10.dll", "urlmon.dll", "oleacc.dll",
              "sensapi.dll", "dhcpcsvc.dll",
              "dhcpcsvc6.dll", "mswsock.dll",
              "cryptbase.dll", "profapi.dll",
              "kernelbase.dll", "user32.dll",
              "ntmarta.dll", "wintrust.dll",
              "msasn1.dll", "clbcatq.dll",
              "iertutil.dll", "nsi.dll",
              "winsta.dll", "wlanapi.dll",
              "bluetoothapis.dll", "bthprops.cpl",
              "vfw32.dll", "avicap32.dll",
              "mf.dll", "mfplat.dll", "mfreadwrite.dll",
              "mfuuid.dll", "strmiids.dll",
              "quartz.dll", "msdmo.dll",
              "d3dcompiler_47.dll", "dxva2.dll",
              "d3d12.dll", "dxcore.dll",
              "windowscodecs.dll",
          }

          def es_sistema(nombre):
              nombre = nombre.lower()
              return (
                  nombre in sistema
                  or nombre.startswith("api-ms-win-")
                  or nombre.startswith("ext-ms-win-")
              )

          patron = re.compile(
              r"DLL Name:\s*(\S+)", re.IGNORECASE
          )

          def dependencias(archivo):
              resultado = subprocess.run(
                  [objdump, "-p", str(archivo)],
                  capture_output=True,
                  text=True,
                  errors="replace",
              )
              if resultado.returncode != 0:
                  raise RuntimeError(
                      f"No se pudo analizar: {archivo}"
                  )
              return patron.findall(resultado.stdout)

          def archivos_binarios():
              for archivo in origen.rglob("*"):
                  if archivo.is_file() and (
                      archivo.suffix.lower() in (".exe", ".dll")
                  ):
                      yield archivo

          cola = deque(archivos_binarios())
          procesados = set()
          faltantes = set()
          copiados = set()

          while cola:
              archivo = cola.popleft()
              identificador = str(archivo.resolve()).lower()

              if identificador in procesados:
                  continue

              procesados.add(identificador)

              for nombre in dependencias(archivo):
                  clave = nombre.lower()

                  if es_sistema(clave):
                      continue

                  destino = origen / nombre

                  if destino.is_file():
                      cola.append(destino)
                      continue

                  encontrado = None

                  for candidato in origen.iterdir():
                      if (
                          candidato.is_file()
                          and candidato.name.lower() == clave
                      ):
                          encontrado = candidato
                          break

                  if encontrado:
                      cola.append(encontrado)
                      continue

                  fuente = disponibles.get(clave)

                  if fuente is None:
                      faltantes.add(clave)
                      print(
                          "NO ENCONTRADA:",
                          nombre,
                          "requerida por",
                          archivo.name,
                          flush=True,
                      )
                      continue

                  shutil.copy2(fuente, destino)
                  copiados.add(clave)
                  cola.append(destino)

                  print(
                      "COPIADA:",
                      nombre,
                      "desde",
                      fuente,
                      flush=True,
                  )

          print("=== RESULTADO ===")
          print("Archivos analizados:", len(procesados))
          print("DLL copiadas:", len(copiados))
          print("Dependencias pendientes:", len(faltantes))

          with open(
              "diagnostico-dll.txt", "w", encoding="utf-8"
          ) as informe:
              informe.write(
                  f"Archivos analizados: {len(procesados)}\n"
              )
              informe.write(
                  f"DLL copiadas: {len(copiados)}\n"
              )
              informe.write("DLL copiadas:\n")
              for nombre in sorted(copiados):
                  informe.write(f"  {nombre}\n")

              informe.write("\nDLL pendientes:\n")
              for nombre in sorted(faltantes):
                  informe.write(f"  {nombre}\n")

          if faltantes:
              print("ERROR: faltan bibliotecas DLL")
              sys.exit(1)

          print("Dependencias comprobadas correctamente")
          PY

          echo "=== CREANDO PAQUETE COMPLETO ==="

          mkdir -p paquete-completo

          tar -czf \
            paquete-completo/avidemux-281-windows64.tar.gz \
            -C "$ORIGEN" .

          cp diagnostico-dll.txt paquete-completo/

          echo "=== PAQUETE PREPARADO ==="
          ls -lh paquete-completo/


      - name: Guardar Avidemux completo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: avidemux-281-windows64-30min
          path: |
            paquete-completo/avidemux-281-windows64.tar.gz
            archivos-instalados.txt
          if-no-files-found: error
          retention-days: 30



      - name: Comprobar archivos y preparar nucleo
        if: success()
        shell: bash
        run: |
          set -e

          mkdir -p paquete-nucleo

          echo "=== BUSCANDO CARPETAS DE COMPILACION ===" \
            | tee resultado-nucleo.txt

          find avidemux -maxdepth 3 -type d \
            -name 'buildMingwCore*' \
            -print | tee -a resultado-nucleo.txt

          echo "=== BUSCANDO BIBLIOTECAS DEL NUCLEO ===" \
            | tee -a resultado-nucleo.txt

          find avidemux -type f \
            \( -name 'libADM_core*.dll' \
               -o -name 'libADM_core*.a' \
               -o -name 'ADM_core*.dll' \) \
            -print | tee -a resultado-nucleo.txt

          echo "=== LOCALIZANDO INSTALACION ===" \
            | tee -a resultado-nucleo.txt


          find avidemux -type f \
            -name '*ADM_core*' \
            -print > listado-archivos-nucleo.txt

          head -80 listado-archivos-nucleo.txt \
            | tee -a resultado-nucleo.txt

          echo "=== GUARDANDO DIRECTORIOS DEL NUCLEO ==="

          find avidemux -maxdepth 3 -type d \
            -name 'buildMingwCore*' -print0 \
            > directorios-nucleo.txt

          if [ ! -s directorios-nucleo.txt ]; then
            echo "ERROR: no se encontro el directorio del nucleo"
            exit 1
          fi

          tar -czf paquete-nucleo/nucleo-build.tar.gz \
            --null -T directorios-nucleo.txt

          echo "=== TAMANO DEL PAQUETE ==="
          ls -lh paquete-nucleo/

          echo "Preparacion completada"

      - name: Guardar nucleo compilado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: avidemux-281-nucleo-compilado
          path: paquete-nucleo/nucleo-build.tar.gz
          if-no-files-found: error
          retention-days: 30


      - name: Recuperar error de compilacion
        if: always()
        shell: bash
        run: |
          echo "Buscando registros de compilacion..."

          find /tmp -maxdepth 1 \
            -name 'logbuildMingw*' -print

          if [ -f /tmp/logbuildMingwCore-x86_64 ]; then
            cp /tmp/logbuildMingwCore-x86_64 \
              error-compilacion-nucleo.txt

            echo "=== ULTIMAS 100 LINEAS ==="
            tail -100 error-compilacion-nucleo.txt
          else
            echo "No se encontro el registro de make"
          fi


      - name: Diagnosticar error de ensamblador FFmpeg
        if: always()
        shell: bash
        run: |
          set +e

          FFBUILD="$GITHUB_WORKSPACE/avidemux/buildMingwCore-x86_64/ffmpeg/build"
          GCC="$GITHUB_WORKSPACE/mxe-source/usr/bin/x86_64-w64-mingw32.shared-gcc"

          mkdir -p "$GITHUB_WORKSPACE/diagnostico-asm"

          if [ ! -f "$FFBUILD/Makefile" ]; then
            echo "No existe el Makefile de FFmpeg"
            exit 0
          fi

          cd "$FFBUILD"

          rm -f libavformat/adtsenc.o

          echo "Reproduciendo el error con ensamblador conservado..."

          make -j1 V=1 libavformat/adtsenc.o \
            CC="$GCC -save-temps=obj" \
            > "$GITHUB_WORKSPACE/diagnostico-asm/compilacion.txt" 2>&1

          echo "Codigo de salida: $?" \
            >> "$GITHUB_WORKSPACE/diagnostico-asm/compilacion.txt"

          echo "Buscando archivos ensamblador..."

          find . -type f -name 'adtsenc.s' \
            -exec cp {} "$GITHUB_WORKSPACE/diagnostico-asm/" \;

          if [ -f "$GITHUB_WORKSPACE/diagnostico-asm/adtsenc.s" ]; then
            grep -n -i -C 5 \
              -E 'shr|shrq|shrl' \
              "$GITHUB_WORKSPACE/diagnostico-asm/adtsenc.s" \
              > "$GITHUB_WORKSPACE/diagnostico-asm/instrucciones-shr.txt"
          fi

          echo "=== RESULTADO ==="
          tail -60 "$GITHUB_WORKSPACE/diagnostico-asm/compilacion.txt"

          echo "=== ARCHIVOS GENERADOS ==="
          ls -lh "$GITHUB_WORKSPACE/diagnostico-asm/"


      - name: Guardar registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-nucleo-avidemux
          path: |
            compilacion-completa.txt
            archivos-instalados.txt
            avidemux/buildMingwQt5-x86_64/CMakeCache.txt
            avidemux/buildMingwPluginsQt5-x86_64/CMakeCache.txt
            compilacion-nucleo.txt
            error-compilacion-nucleo.txt
            resultado-nucleo.txt
            avidemux/buildMingwCore-x86_64/CMakeCache.txt
            diagnostico-asm/
            avidemux/buildMingwCore-x86_64/CMakeFiles/CMakeConfigureLog.yaml
            avidemux/buildMingwCore-x86_64/CMakeFiles/CMakeOutput.log
            avidemux/buildMingwCore-x86_64/CMakeFiles/CMakeError.log
          if-no-files-found: warn
