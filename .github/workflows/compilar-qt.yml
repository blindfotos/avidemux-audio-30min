
name: Compilacion nocturna Qt5 Windows 64 bits

on:
  workflow_dispatch:

jobs:
  compilar-qt:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential autoconf automake autopoint \
            bison flex gperf intltool libtool libtool-bin \
            nasm yasm pkg-config patch wget curl git \
            python3 python3-mako python3-pip \
            unzip p7zip-full xz-utils texinfo gettext \
            libssl-dev libgdk-pixbuf2.0-dev lzip

      - name: Descargar MXE
        run: |
          git clone https://github.com/mxe/mxe.git mxe-source
          git -C mxe-source checkout \
            bdc0e9e2cf878d64086a6f3b51bc443d4c5ebb9c
          echo 'MXE_TARGETS := x86_64-w64-mingw32.shared' \
            > mxe-source/settings.mk

      - name: Recuperar compilador guardado
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            mxe-source/usr
            mxe-source/pkg
          key: mxe-64bits-bdc0e9e2-ubuntu2204-v1
          fail-on-cache-miss: true

      - name: Comprobar compilador recuperado
        run: |
          test -f \
            mxe-source/usr/x86_64-w64-mingw32.shared/installed/zlib
          echo "Compilador MXE recuperado"
          du -sh mxe-source/usr
          df -h .

      - name: Compilar Qt5 y dependencias
        id: qt
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          make -C mxe-source -j2 qtbase \
            MXE_TARGETS=x86_64-w64-mingw32.shared \
            2>&1 | tee compilacion-qt.log

      - name: Generar informe
        if: always()
        shell: bash
        run: |
          {
            echo "=== RESULTADO ==="
            echo "${{ steps.qt.outcome }}"
            echo "=== QT INSTALADO ==="
            find mxe-source/usr -path '*/installed/qtbase' \
              2>/dev/null || true
            echo "=== TAMANO ==="
            du -sh mxe-source/usr mxe-source/pkg \
              2>/dev/null || true
            echo "=== ESPACIO LIBRE ==="
            df -h .
            echo "=== ULTIMAS 150 LINEAS ==="
            tail -150 compilacion-qt.log \
              2>/dev/null || true
          } > informe-qt.txt

      - name: Guardar informe y registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-compilacion-qt
          path: |
            informe-qt.txt
            compilacion-qt.log
          if-no-files-found: warn
          retention-days: 30

      - name: Guardar Qt compilado en cache
        if: steps.qt.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            mxe-source/usr
            mxe-source/pkg
          key: mxe-64bits-bdc0e9e2-qtbase-v1

      - name: Comprobar resultado final
        if: always()
        run: |
          test "${{ steps.qt.outcome }}" = "success"
